services:
  telephony:
    build: .
    image: dss-telephony:latest
    container_name: dss-telephony
    restart: unless-stopped
    env_file: .env

    # Runs as the host user that owns the bind mounts, not as the image's
    # built-in uid.
    #
    # This is not cosmetic. Compose creates missing bind-mount directories as
    # whoever ran it, so `sudo docker compose up` leaves recordings/ and
    # deadletter/ owned by root:root 755 - and the image's uid 10001 then
    # cannot write to either. The failure is invisible until the first real
    # call, at which point archival fails AND the dead-letter meant to record
    # that failure fails too. (The Twilio copy survives, because deletion is
    # gated on a verified write, so nothing is lost - but nothing is kept
    # locally either.)
    #
    # Set SERVICE_UID/SERVICE_GID to the owner of ./recordings. Still non-root,
    # so the reason the image drops privileges is intact.
    user: "${SERVICE_UID:-10001}:${SERVICE_GID:-10001}"

    environment:
      # Container paths, overriding whatever the .env carried over from a laptop.
      LOCAL_STORAGE_ROOT: /app/recordings
      # Separate from the archive on purpose: everything under MEDIA_ROOT is
      # reachable over a signed public url, and customer recordings must not be.
      MEDIA_ROOT: /app/media
      WHISPER_CLI_PATH: /usr/local/bin/whisper-cli
      WHISPER_MODEL_PATH: /models/ggml-base-q5_0.bin
      FFMPEG_PATH: /usr/bin/ffmpeg
      PORT: "8080"
    ports:
      # Bound to loopback only. Tailscale Funnel proxies from localhost, so the
      # service must not also be reachable from the LAN - the webhook endpoints
      # are authenticated but the archive is not something to expose broadly.
      # Host 8090 because signal-cli already holds 8080 on maple.
      - "127.0.0.1:8090:8080"
    extra_hosts:
      # Hermes' webhook platform binds the host loopback, which is not the
      # container's loopback. This is how the bridge reaches it.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./recordings:/app/recordings
      - ./deadletter:/app/deadletter
      # Read-only inside the container: the service serves these files, it has
      # no reason to write them, and a compromised handler should not be able
      # to publish new ones.
      - ./media:/app/media:ro
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
